<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>双窗口验收</title>
<style>body { font: 16px system-ui; margin: 32px; background: #f3f5f7; color: #1b2632; } pre { white-space: pre-wrap; }</style></head>
<body><h1>双窗口与注入验收</h1><pre id="result">正在验证…</pre>
<script>
const tauri = window.__TAURI__;
const output = document.getElementById("result");
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const invoke = tauri.pytaruix.pyInvoke;
// 轻量断言：解析错误对象，避免把 [object Object] 当成错误码。
const failedWith = async (code, call) => {
  try { await call(); return false; }
  catch (error) { return error?.code === code; }
};
async function run() {
  const window = tauri.webviewWindow.getCurrentWebviewWindow();
  const label = window.label;
  let targets = 0;
  let removed = 0;
  const unlisten = await window.listen("target-check", event => {
    if (event.payload.target === "secondary") targets++;
  });
  const remove = await window.listen("target-check", () => removed++);
  await remove();
  const response = await invoke("probe", { claimed_label: "spoof" }, { headers: { "x-migration": "migrating-client" } });
  const checks = {
    origin: response.label === label,
    setup: response.setup === true,
    headers: response.headers === true,
    native_listeners: await invoke("events"),
  };
  const bytes = new Uint8Array(await invoke("raw", "abc"));
  checks.raw_bytes = bytes.length === 3 && bytes[0] === 0x63 && bytes[1] === 0x62 && bytes[2] === 0x61;
  checks.scalar = (await invoke("scalar", 5)) === 6;
  checks.empty = (await invoke("empty")) === "empty-ok";
  checks.fail_error = await failedWith("command_failed", () => invoke("fail"));
  checks.validation = await failedWith("invalid_payload", () => invoke("scalar", { nested: true }));
  checks.unknown = await failedWith("unknown_command", () => invoke("not-registered"));
  try { await invoke("probe", { claimed_label: "spoof", webview_window: "main" }); checks.injected_spoof = false; }
  catch (error) { checks.injected_spoof = error.code === "invalid_payload"; }
  checks.recovered = (await invoke("empty")) === "empty-ok";
  // 两窗口都安装监听并调用 probe 后再发送定向事件。
  let both = false;
  for (let i = 0; i < 100 && !both; i++) { both = await invoke("ready"); if (!both) await sleep(25); }
  checks.shared_state = both;
  await sleep(200);
  checks.target_isolation = label === "secondary" ? targets > 0 : targets === 0;
  checks.unlisten = removed === 0;
  await unlisten();
  const previous = targets;
  await invoke("ready");
  await sleep(100);
  checks.unlisten_active = targets === previous;
  output.textContent = JSON.stringify(checks, null, 2);
  await invoke("report", checks);
}
run().catch(async error => {
  output.textContent = String(error);
  await invoke("diagnostic", String(error));
});
</script></body></html>
