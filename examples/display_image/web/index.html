<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>显示器与图像验收</title>
<body><h1>显示器与图像</h1><pre id="result">正在验收…</pre><script>
const invoke = window.__TAURI__.pytaruix.pyInvoke;
(async () => {
  try {
    await invoke("inspect");
    await invoke("retire");
    await invoke("finish");
    document.getElementById("result").textContent = "验收完成";
  } catch(error) {
    await invoke("diagnostic", {body: String(error)});
  }
})();
</script></body></html>
