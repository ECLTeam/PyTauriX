<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>宿主验收</title>
<body><p>宿主配置与权限验收</p><pre id="result"></pre>
<script>
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
(async () => {
  const {label, reportUrl} = window.__HOST_ACCEPTANCE__;
  const checks = {};
  try {
    const invoke = (command, body) => window.__TAURI__.pytaruix.pyInvoke(command, body);
    if (label === "rogue" || label === "external" || label === "main-denied") {
      try { await invoke("identify", {}); checks.denied = false; }
      catch (error) { checks.denied = /not allowed|denied/i.test(String(error)); }
      try { await window.__TAURI__.window.getCurrentWindow().title(); checks.coreDenied = false; }
      catch (error) { checks.coreDenied = /not allowed|denied/i.test(String(error)); }
    } else {
      const response = await invoke("identify", {app_handle:"spoof", webview_window:"spoof"});
      checks.injection = response.label === label && response.body.app_handle === "spoof";
      checks.identity = await window.__TAURI__.app.getName() === "ECL Host Acceptance" &&
        await window.__TAURI__.app.getVersion() === "1.2.3";
      checks.source = location.origin === window.__HOST_ACCEPTANCE__.expectedOrigin;
      checks.decorations = await window.__TAURI__.window.getCurrentWindow().isDecorated();
      if (label === "main") {
        await window.__TAURI__.window.getCurrentWindow().minimize();
        checks.nativeMinimize = await invoke("restore", {});
        checks.devtools = await invoke("devtools", {});
      }
      if (label === "theme-studio") {
        await window.__TAURI__.window.getCurrentWindow().close();
        checks.closeRequested = await invoke("close_observed", {});
      }
    }
  } catch (error) { checks.unexpected = String(error); }
  document.getElementById("result").textContent = JSON.stringify(checks);
  await fetch(reportUrl, {method:"POST", body:JSON.stringify({label,checks})});
})();
</script></body></html>
