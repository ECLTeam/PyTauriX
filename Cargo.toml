[workspace]
members = ["crates/bindings", "crates/bridge"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
tauri = { version = "=2.12.1", default-features = false }
pyo3 = { version = "=0.30.1" }
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = "s"
codegen-units = 1
