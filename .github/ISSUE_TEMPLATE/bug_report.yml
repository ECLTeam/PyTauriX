name: 缺陷报告
description: 报告可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        有安全影响的问题请走 [Private vulnerability reporting](https://github.com/ECLTeam/PyTaruiX/security/advisories/new)，
        不要在这里提交。
  - type: textarea
    id: summary
    attributes:
      label: 现象
      description: 实际发生了什么，期望是什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最小可复现流程。附代码时裁剪到能触发问题的最小片段。
      placeholder: |
        1. uv run --no-sync maturin develop --locked --jobs 1
        2. 运行 examples/minimal
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: "`python -c \"import pytaruix; print(pytaruix.__version__)\"` 或提交 SHA"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 平台
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "3.14.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与错误码
      description: 粘贴原始输出。正文、令牌与隐私路径请脱敏。
      render: text
