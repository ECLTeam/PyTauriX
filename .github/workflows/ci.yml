name: PytaruiX validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync maturin build --release --locked --jobs 1 --features devtools,tray-icon --out dist
      - name: Install compiled wheel
        shell: python
        run: |
          import pathlib, subprocess
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          subprocess.run(["uv", "pip", "install", "--no-deps", str(wheel)], check=True)
      - run: uv run --no-sync ruff check python tests scripts examples
      - run: uv run --no-sync ruff format --check python tests scripts examples
      - run: uv run --no-sync pyright
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --jobs 1 --features devtools,tray-icon -- -D warnings
      - name: Tray feature boundaries
        run: |
          cargo clippy --locked --jobs 1 --features devtools -- -D warnings
          cargo clippy --locked --jobs 1 --no-default-features --features wry,tray-icon -- -D warnings
      - run: uv run --no-sync python scripts/update_coverage.py --check
      - name: Python tests with Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --no-sync pytest -q
      - name: Python tests
        if: runner.os != 'Linux'
        run: uv run --no-sync pytest -q
      - run: uv run --no-sync maturin sdist --out dist
      - name: Verify source archive
        shell: python
        run: |
          import pathlib, subprocess
          archive = next(pathlib.Path("dist").glob("*.tar.gz"))
          subprocess.run(["uv", "run", "--no-sync", "python", "scripts/check_sdist.py", str(archive)], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: pytaruix-${{ matrix.os }}-${{ matrix.python }}
          path: dist/

  desktop:
    # 原生 UI 驱动需要实际交互式 Windows 会话和 WebView2；不能把无 GUI 构建视为验收。
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, interactive-desktop]
    env:
      PYTHONUTF8: "1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync maturin develop --locked --jobs 1 --features devtools,tray-icon
      - name: Serialized native acceptance
        shell: python
        run: |
          import subprocess
          for suite in ("desktop", "dynamic_window", "event_dispatch", "dialog", "channel", "display_image", "menu", "host_config", "tray", "window_attributes", "webview_policy", "system_interaction"):
              subprocess.run(["uv", "run", "--no-sync", "python", f"scripts/{suite}_smoke.py"], check=True)
